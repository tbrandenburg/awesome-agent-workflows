name: Validate workflows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Install lint tools
        run: |
          python3 -m pip install -r requirements-dev.txt
          npm ci
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Install pinned Dagu
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/dagu-tools"
          filename=dagu_2.24.0_linux_amd64.tar.gz
          mkdir -p "$directory"
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/dagucloud/dagu/releases/download/v2.24.0/dagu_2.24.0_linux_amd64.tar.gz \
            --output "$directory/$filename"
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/dagucloud/dagu/releases/download/v2.24.0/checksums.txt \
            --output "$directory/checksums.txt"
          cd "$directory"
          awk -v file="$filename" '$2 == file || $2 == "*" file {print}' checksums.txt | sha256sum --check --strict
          tar -xzf "$filename" dagu
          echo "$directory" >> "$GITHUB_PATH"
      - name: Format, lint and validate artifacts
        run: make validate
