name: Validate workflows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Install pinned Dagu
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/dagu-tools"
          mkdir -p "$directory"
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/dagucloud/dagu/releases/download/v2.24.0/dagu_2.24.0_linux_amd64.tar.gz \
            --output "$directory/dagu.tar.gz"
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/dagucloud/dagu/releases/download/v2.24.0/checksums.txt \
            --output "$directory/checksums.txt"
          python3 - "$directory" <<'PY'
          import hashlib, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          filename = 'dagu_2.24.0_linux_amd64.tar.gz'
          rows = [line.split() for line in (root / 'checksums.txt').read_text().splitlines()]
          expected = next(row[0] for row in rows if len(row) == 2 and row[1].lstrip('*') == filename)
          if hashlib.sha256((root / 'dagu.tar.gz').read_bytes()).hexdigest() != expected:
              raise SystemExit('Dagu checksum mismatch')
          PY
          tar -xzf "$directory/dagu.tar.gz" -C "$directory" dagu
          echo "$directory" >> "$GITHUB_PATH"
      - name: Validate deployable artifacts
        run: make validate
