name: Manual Dagu Issue Resolution
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Trusted target owner/name
        required: true
        type: string
      issue_number:
        description: Issue number; zero selects an open issue
        type: number
        default: 0
      base_branch:
        description: Empty selects the repository default branch
        type: string
        default: ""
      auto_merge:
        description: Merge only after validation, independent review, CI and GitHub rules pass
        type: boolean
        default: true
      workspace_root:
        description: Absolute persistent workspace on the self-hosted runner
        type: string
        default: /var/lib/dagu/workspaces
permissions: { contents: read }
concurrency:
  group: issue-resolver-${{ inputs.repository }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: [self-hosted, linux]
    timeout-minutes: 130
    env:
      GH_TOKEN: ${{ secrets.RESOLVER_GH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      REPOSITORY: ${{ inputs.repository }}
      ISSUE: ${{ inputs.issue_number }}
      BASE: ${{ inputs.base_branch }}
      AUTO_MERGE: ${{ inputs.auto_merge }}
      WORKSPACE_ROOT: ${{ inputs.workspace_root }}
      WORKFLOW_HOST_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Guard visibility and run the canonical local workflow
        env:
          DAGU_HOME: ${{ runner.temp }}/issue-resolver-dagu
        shell: python
        run: |
          import json
          import os
          import pathlib
          import re
          import subprocess


          def require_private_host(target_private: object, host_private: str) -> None:
              if not isinstance(target_private, bool):
                  raise ValueError("Cannot verify target visibility")
              if target_private and host_private != "true":
                  raise ValueError("Private targets require a private workflow-host repository")


          repository = os.environ["REPOSITORY"]
          if not re.fullmatch(r"[A-Za-z0-9_-]+/[A-Za-z0-9_.-]+", repository):
              raise ValueError("Target must be owner/name")
          result = subprocess.run(
              ["gh", "repo", "view", repository, "--json", "isPrivate"],
              capture_output=True,
              text=True,
              check=True,
              timeout=30,
          )
          require_private_host(json.loads(result.stdout)["isPrivate"], os.environ["WORKFLOW_HOST_PRIVATE"])
          empty = pathlib.Path(os.environ["RUNNER_TEMP"]) / "issue-resolver-empty.env"
          empty.touch()
          params = dict(
              repository=repository,
              issue_number=os.environ["ISSUE"],
              base_branch=os.environ["BASE"],
              auto_merge=os.environ["AUTO_MERGE"],
              workspace_root=os.environ["WORKSPACE_ROOT"],
              deployment_env_file=str(empty),
          )
          subprocess.run(
              ["dagu", "start", "workflows/issue-resolution.yaml", "--params", json.dumps(params)],
              check=True,
              timeout=7500,
          )
      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-resolver-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/issue-resolver-dagu/data/artifacts/
            ${{ runner.temp }}/issue-resolver-dagu/logs/
          if-no-files-found: warn
          retention-days: 7
