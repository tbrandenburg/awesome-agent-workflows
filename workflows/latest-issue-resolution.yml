description: Latest Issue Resolution
type: graph
schedule: "0 * * * *"

params:
  - name: repo
    type: string
    default: ""  # optional owner/name; empty runs in the current directory

steps:
  - id: run_local
    preconditions:
      - { condition: '${params.repo}', expected: 're:^$' }
    action: dag.run
    with:
      dag: issue-resolution-run

  - id: clone
    preconditions:
      - { condition: '${params.repo}', expected: 're:.+' }
    # gh reuses the local gh login, so private repos work too.
    # Skip cloning when a step retry finds the run's clone already there.
    action: exec
    with:
      command: sh
      args:
        - -c
        - '[ -d "$2/.git" ] || gh repo clone "$1" "$2"'
        - sh
        - ${params.repo}
        - ${env.DAG_RUN_WORK_DIR}/repo

  - id: run_cloned
    depends: [clone]
    action: dag.run
    with:
      dag: issue-resolution-run
      params:
        project_dir: ${env.DAG_RUN_WORK_DIR}/repo

---
name: issue-resolution-run
type: graph

params:
  - name: project_dir
    type: string
    default: .
# Dagu 2.25.1 startup expands bare parameter env vars here, not scoped references.
working_dir: $project_dir

retry_policy:
  limit: 0

steps:
  - id: check_open_issues
    action: exec
    with:
      command: gh
      args:
        - issue
        - list
        - --limit
        - "1"
        - --state
        - open
        - --json
        - number
        - --jq
        - '.[0].number // error("No open issue")'
    output: ISSUE_ID

  - id: fetch_main
    depends: [check_open_issues]
    action: exec
    with:
      command: git
      args: [fetch, origin, main]

  - id: main_commit
    depends: [fetch_main]
    action: exec
    with:
      command: git
      args: [rev-parse, --verify, FETCH_HEAD]
    output: MAIN_COMMIT

  - id: repository_root
    depends: [main_commit]
    action: exec
    with:
      command: git
      args: [rev-parse, --show-toplevel]
    output: REPOSITORY_ROOT

  - id: worktree
    depends: [repository_root]
    # Reuse a matching worktree without resetting it; fail on conflicts.
    action: git.worktree.add
    with:
      branch: issue/${env.ISSUE_ID}
      path: ${env.REPOSITORY_ROOT}-issue-${env.ISSUE_ID}
      create_branch: true
      base: ${env.MAIN_COMMIT}

  # Dagu 2.25.1 working_dir cannot resolve predecessor outputs; child params can.
  - id: resolve_issue
    depends: [worktree]
    action: dag.run
    with:
      dag: resolve-issue-worktree
      params:
        issue_id: ${env.ISSUE_ID}
        worktree_path: ${steps.worktree.outputs.path}
        branch: ${steps.worktree.outputs.branch}
    output:
      merged_head:
        from: stdout
        decode: json
        select: .outputs.WORKTREE_HEAD

  - id: cleanup_worktree
    depends: [resolve_issue]
    action: git.worktree.remove
    with:
      path: ${steps.worktree.outputs.path}
      branch: ${steps.worktree.outputs.branch}
      delete_branch: true
      # The child verifies this exact HEAD was merged; allow squash/rebase merges too.
      force_delete_branch: true

  - id: remote_branch
    depends: [cleanup_worktree]
    action: exec
    with:
      command: git
      args: [ls-remote, --heads, origin, 'refs/heads/${steps.worktree.outputs.branch}']
    output: REMOTE_BRANCH

  - id: delete_remote_branch
    depends: [remote_branch]
    # GitHub may have auto-deleted it. Never delete a branch advanced past the merged HEAD.
    preconditions:
      - { condition: '${env.REMOTE_BRANCH}', expected: 're:.+' }
    continue_on:
      skipped: true
    action: exec
    with:
      command: git
      args:
        - push
        - origin
        - --force-with-lease=refs/heads/${steps.worktree.outputs.branch}:${resolve_issue.output.merged_head}
        - ':refs/heads/${steps.worktree.outputs.branch}'

---
name: resolve-issue-worktree
type: graph
params:
  - { name: issue_id, type: string, required: true }
  - { name: worktree_path, type: string, required: true }
  - { name: branch, type: string, required: true }
working_dir: $worktree_path

harness:
  provider: opencode
  agent: build
  model: openai/gpt-6-luna

retry_policy:
  limit: 0

steps:
  - id: plan_issue
    action: harness.run
    with:
      prompt: |
        You are running in the issue worktree on branch ${params.branch}.
        Stay in this worktree; do not create or switch branches.
        Investigate GitHub issue #${params.issue_id} and its comments against the current code
        without modifying repository files or implementing the fix.
        Inspect its linked PR if one exists, but stop if its head branch differs.
        Publish an implementation plan as an issue comment headed "## Implementation plan".
        Include the scope, relevant code references, ordered implementation tasks,
        validation commands, acceptance criteria, and any risks or open questions.
        Verify the comment was published with gh issue view ${params.issue_id} --comments before finishing.
        If publication fails, report the error and fail this step; do not proceed to fixing.

  - id: fix_issue
    depends: [plan_issue]
    action: harness.run
    with:
      prompt: |
        You are running in the issue worktree on branch ${params.branch}.
        Stay in this worktree; do not create or switch branches.
        Address GitHub issue #${params.issue_id}.
        Continue its linked PR if one exists, but stop if its head branch differs.
        Read the issue comments with gh issue view ${params.issue_id} --comments and use the latest
        "## Implementation plan" comment as guidance. Stop if no plan comment exists.
        Check the plan and any investigation comments against the current code,
        implement a focused fix, and run the plan's validation commands and relevant tests.
        Document any necessary deviations from the plan in an issue comment.
        Keep summary, findings and verification evidence in your response and GitHub comments.

  - id: commit_push
    depends: [fix_issue]
    action: harness.run
    with:
      prompt: |
        You are running in the issue worktree on branch ${params.branch}.
        Stay in this worktree; do not create or switch branches.
        Review the local diff, commit the related changes, and push this branch.
        Create or update a PR linked to issue #${params.issue_id}, with a concise summary and test results.
        Do not include unrelated changes.
        Keep summary, findings and verification evidence in your response and GitHub comments.

  - id: get_linked_pr
    depends: [commit_push]
    action: exec
    with:
      command: gh
      args:
        - issue
        - view
        - ${params.issue_id}
        - --json
        - closedByPullRequestsReferences
        - --jq
        - '.closedByPullRequestsReferences[0].number // error("No linked PR")'
    output: PR_ID

  - id: resolve_ci_errors
    depends: [get_linked_pr]
    action: harness.run
    with:
      prompt: |
        You are running in the issue worktree on branch ${params.branch}.
        Stay in this worktree; do not create or switch branches.
        Check GitHub issue #${params.issue_id} and its linked PR #${env.PR_ID}. If CI failures or merge
        conflicts block the PR, investigate the cause, fix it, run relevant checks,
        and commit and push the changes. Iterate till CI is green and mergable.
        Keep summary, findings and verification evidence in your response and GitHub comments.

  - id: review_pr
    depends: [resolve_ci_errors]
    action: harness.run
    with:
      prompt: |
        You are running in the issue worktree on branch ${params.branch}.
        Stay in this worktree; do not create or switch branches.
        Review PR #${env.PR_ID} adversially linked to GitHub issue #${params.issue_id}.
        Post actionable findings
        as a PR comment, noting severity and useful code references.

  - id: merge_pr
    depends: [review_pr]
    action: harness.run
    with:
      prompt: |
        You are running in the issue worktree on branch ${params.branch}.
        Stay in this worktree; do not create or switch branches.
        Merge remotely; do not use --delete-branch or remove the worktree.
        Check GitHub issue #${params.issue_id} and its linked PR #${env.PR_ID} and its PR comments. Raise non-duplicate GitHub
        issues for unresolved high-priority review findings, failing CI, or merge blockers.
        Merge when required checks pass and no blocking findings remain.
        Keep summary, findings and verification evidence in your response and GitHub comments.

  - id: worktree_head
    depends: [merge_pr]
    action: exec
    with:
      command: git
      args: [rev-parse, HEAD]
    output: WORKTREE_HEAD

  - id: verify_merged
    depends: [worktree_head]
    action: exec
    with:
      command: gh
      args:
        - pr
        - view
        - ${env.PR_ID}
        - --json
        - state,headRefName,headRefOid
        - --jq
        - 'if .state == "MERGED" and .headRefName == "${params.branch}" and .headRefOid == "${env.WORKTREE_HEAD}" then .headRefOid else error("PR is not merged or does not match the local issue branch HEAD") end'
