description: Resolve the newest open GitHub issue
type: graph

params:
  - name: repo
    type: string
    default: ""  # optional owner/name; empty uses the current directory

steps:
  - id: latest_issue
    action: exec
    with:
      command: sh
      args:
        - -c
        - 'gh issue list ${1:+--repo "$1"} --limit 1 --state open --json number --jq ".[0].number // error(\"No open issue\")"'
        - sh
        - ${params.repo}
    output: ISSUE_ID

  - id: resolve
    depends: [latest_issue]
    action: dag.run
    with:
      dag: issue-resolution.yml
      params:
        issue_id: ${env.ISSUE_ID}
        repo: ${params.repo}
