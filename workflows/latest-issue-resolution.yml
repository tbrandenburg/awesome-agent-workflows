description: Latest Issue Resolution
type: graph
schedule: "0 * * * *"

params:
  - name: repo
    type: string
    default: ""  # optional owner/name; empty runs in the current directory

steps:
  - id: run_local
    preconditions:
      - { condition: '${params.repo}', expected: 're:^$' }
    action: dag.run
    with:
      dag: issue-resolution-run

  - id: clone
    preconditions:
      - { condition: '${params.repo}', expected: 're:.+' }
    # gh reuses the local gh login, so private repos work too.
    # Skip cloning when a step retry finds the run's clone already there.
    action: exec
    with:
      command: sh
      args:
        - -c
        - '[ -d "$2/.git" ] || gh repo clone "$1" "$2"'
        - sh
        - ${params.repo}
        - ${env.DAG_RUN_WORK_DIR}/repo

  - id: run_cloned
    depends: [clone]
    action: dag.run
    with:
      dag: issue-resolution-run
      params:
        project_dir: ${env.DAG_RUN_WORK_DIR}/repo

---
name: issue-resolution-run
type: graph

params:
  - name: project_dir
    type: string
    default: .
# Dagu 2.25.1 startup expands bare parameter env vars here, not scoped references.
working_dir: $project_dir

retry_policy:
  limit: 0

steps:
  - id: check_open_issues
    action: exec
    with:
      command: gh
      args:
        - issue
        - list
        - --limit
        - "1"
        - --state
        - open
        - --json
        - number
        - --jq
        - '.[0].number // error("No open issue")'
    output: ISSUE_ID

  - id: fetch_main
    depends: [check_open_issues]
    action: exec
    with:
      command: git
      args: [fetch, origin, main]

  - id: main_commit
    depends: [fetch_main]
    action: exec
    with:
      command: git
      args: [rev-parse, --verify, FETCH_HEAD]
    output: MAIN_COMMIT

  - id: repository_root
    depends: [main_commit]
    action: exec
    with:
      command: git
      args: [rev-parse, --show-toplevel]
    output: REPOSITORY_ROOT

  - id: worktree
    depends: [repository_root]
    # Reuse a matching worktree without resetting it; fail on conflicts.
    action: git.worktree.add
    with:
      branch: issue/${env.ISSUE_ID}
      path: ${env.REPOSITORY_ROOT}-issue-${env.ISSUE_ID}
      create_branch: true
      base: ${env.MAIN_COMMIT}

  # Dagu 2.25.1 working_dir cannot resolve predecessor outputs; child params can.
  - id: resolve_issue
    depends: [worktree]
    action: dag.run
    with:
      dag: resolve-issue-worktree
      params:
        issue_id: ${env.ISSUE_ID}
        worktree_path: ${steps.worktree.outputs.path}
        branch: ${steps.worktree.outputs.branch}
    output:
      merged_head:
        from: stdout
        decode: json
        select: .outputs.WORKTREE_HEAD

  - id: cleanup_worktree
    depends: [resolve_issue]
    action: git.worktree.remove
    with:
      path: ${steps.worktree.outputs.path}
      branch: ${steps.worktree.outputs.branch}
      delete_branch: true
      # The child verifies this exact HEAD was merged; allow squash/rebase merges too.
      force_delete_branch: true

  - id: remote_branch
    depends: [cleanup_worktree]
    action: exec
    with:
      command: git
      args: [ls-remote, --heads, origin, 'refs/heads/${steps.worktree.outputs.branch}']
    output: REMOTE_BRANCH

  - id: delete_remote_branch
    depends: [remote_branch]
    # GitHub may have auto-deleted it. Never delete a branch advanced past the merged HEAD.
    preconditions:
      - { condition: '${env.REMOTE_BRANCH}', expected: 're:.+' }
    continue_on:
      skipped: true
    action: exec
    with:
      command: git
      args:
        - push
        - origin
        - --force-with-lease=refs/heads/${steps.worktree.outputs.branch}:${resolve_issue.output.merged_head}
        - ':refs/heads/${steps.worktree.outputs.branch}'

---
name: resolve-issue-worktree
type: graph
params:
  - { name: issue_id, type: string, required: true }
  - { name: worktree_path, type: string, required: true }
  - { name: branch, type: string, required: true }
working_dir: $worktree_path

harness:
  provider: opencode
  agent: build
  model: openai/gpt-6-luna

retry_policy:
  limit: 0

steps:
  - id: plan_issue
    action: harness.run
    with:
      prompt: |
        You are running in the issue worktree on branch ${params.branch}.
        Stay in this worktree; do not create or switch branches.

        ## Purpose
        Create an actionable implementation plan for GitHub issue #${params.issue_id}.

        ## Inputs
        Read the issue and raw comments with gh issue view ${params.issue_id} --json body,comments.
        Inspect the current code and linked PR, if present.

        ## Instructions
        1. Stop if the linked PR has a different head branch.
        2. Investigate the issue against the code without modifying files or implementing the fix.
        3. Define scoped tasks, validation commands, acceptance criteria, and risks or open questions.

        ## Output
        Publish an issue comment headed "## Implementation plan" containing
        <!-- issue-resolution:plan -->, scope, code references, and the planned work and validation.
        Verify its marker and content with gh issue view ${params.issue_id} --json comments.
        If publication fails, report the error and fail this step.

  - id: fix_issue
    depends: [plan_issue]
    action: harness.run
    with:
      prompt: |
        You are running in the issue worktree on branch ${params.branch}.
        Stay in this worktree; do not create or switch branches.

        ## Purpose
        Resolve GitHub issue #${params.issue_id} with a focused, verified fix.

        ## Inputs
        Read the issue and raw comments with gh issue view ${params.issue_id} --json body,comments.
        Use the latest comment containing <!-- issue-resolution:plan -->; stop if it is missing.

        ## Instructions
        1. Continue the linked PR if present; stop if its head branch differs.
        2. Check the plan and investigation comments against the current code.
        3. Implement a focused fix and relevant regression tests.
        4. Run the plan's validation commands and relevant repository checks.

        ## Output
        Publish an issue comment containing <!-- issue-resolution:implementation --> with
        the change summary, findings, validation evidence, deviations, and unresolved blockers.
        Verify its marker and content with gh issue view ${params.issue_id} --json comments.
        If publication fails, report the error and fail this step.

  - id: commit_push
    depends: [fix_issue]
    action: harness.run
    with:
      prompt: |
        You are running in the issue worktree on branch ${params.branch}.
        Stay in this worktree; do not create or switch branches.

        ## Purpose
        Commit and publish the fix as a PR linked to GitHub issue #${params.issue_id}.

        ## Inputs
        Read the issue and raw comments with gh issue view ${params.issue_id} --json body,comments.
        Use the latest comments containing <!-- issue-resolution:plan --> and
        <!-- issue-resolution:implementation -->; stop if either is missing. Inspect the local diff.

        ## Instructions
        1. Review the diff against the plan and implementation evidence; exclude unrelated changes.
        2. Commit the related changes and push this branch.
        3. Create or update the linked PR with a concise summary, test results, and Closes #${params.issue_id}.

        ## Output
        Report the commit and PR URL, summary, findings, and verification evidence.
        Verify the remote branch and PR reflect the intended commit; report errors and fail on publication failure.

  - id: get_linked_pr
    depends: [commit_push]
    action: exec
    with:
      command: gh
      args:
        - issue
        - view
        - ${params.issue_id}
        - --json
        - closedByPullRequestsReferences
        - --jq
        - '.closedByPullRequestsReferences[0].number // error("No linked PR")'
    output: PR_ID

  - id: resolve_ci_errors
    depends: [get_linked_pr]
    action: harness.run
    with:
      prompt: |
        You are running in the issue worktree on branch ${params.branch}.
        Stay in this worktree; do not create or switch branches.

        ## Purpose
        Resolve CI failures and merge conflicts blocking PR #${env.PR_ID}.

        ## Inputs
        Read GitHub issue #${params.issue_id}, linked PR #${env.PR_ID}, and its live checks and conflicts.

        ## Instructions
        1. Investigate blocking failures or conflicts and fix their causes.
        2. Run relevant checks, then commit and push related changes.
        3. Recheck until CI passes and the PR is mergeable. Pending checks are not passing.

        ## Output
        Publish an issue comment containing <!-- issue-resolution:ci --> with the PR head commit,
        CI status, fixes, and verification evidence, even when no fixes were needed.
        Verify its marker and content with gh issue view ${params.issue_id} --json comments.
        If publication fails, report the error and fail this step.

  - id: review_pr
    depends: [resolve_ci_errors]
    action: harness.run
    with:
      prompt: |
        You are running in the issue worktree on branch ${params.branch}.
        Stay in this worktree; do not create or switch branches.

        ## Purpose
        Review PR #${env.PR_ID} adversarially against GitHub issue #${params.issue_id}.

        ## Inputs
        Read the issue and raw comments with gh issue view ${params.issue_id} --json body,comments.
        Use the latest comments containing <!-- issue-resolution:plan -->,
        <!-- issue-resolution:implementation -->, and <!-- issue-resolution:ci -->; stop if any is missing.

        ## Instructions
        1. Review the actual PR diff, surrounding code, and relevant tests.
        2. Check handoff claims against the current code and live CI.
        3. Identify actionable findings and whether any block merging.

        ## Output
        Publish a PR comment containing <!-- issue-resolution:review --> with the reviewed head commit,
        findings, severity, code references, and explicitly whether blockers remain.
        Verify its marker and content with gh pr view ${env.PR_ID} --json comments.
        If publication fails, report the error and fail this step.

  - id: merge_pr
    depends: [review_pr]
    action: harness.run
    with:
      prompt: |
        You are running in the issue worktree on branch ${params.branch}.
        Stay in this worktree; do not create or switch branches.

        ## Purpose
        Merge PR #${env.PR_ID} only when checks pass and no blocking findings remain.

        ## Inputs
        Read raw issue comments with gh issue view ${params.issue_id} --json comments and PR
        comments with gh pr view ${env.PR_ID} --json comments. Use the latest issue comment
        containing <!-- issue-resolution:ci --> and PR comment containing
        <!-- issue-resolution:review -->; stop if either is missing or describes a different PR head commit.

        ## Instructions
        1. Check the issue, PR, and PR comments; verify live checks and findings rather than trusting tags.
        2. Raise non-duplicate GitHub issues for unresolved high-priority findings, failing CI, or merge blockers.
        3. Merge remotely only when required checks pass and no blockers remain.
           Do not use --delete-branch or remove the worktree.

        ## Output
        Verify the PR is merged and report the merge result, findings, and evidence in your response
        and GitHub comments. If merging fails or remains blocked, report the cause and fail this step.

  - id: worktree_head
    depends: [merge_pr]
    action: exec
    with:
      command: git
      args: [rev-parse, HEAD]
    output: WORKTREE_HEAD

  - id: verify_merged
    depends: [worktree_head]
    action: exec
    with:
      command: gh
      args:
        - pr
        - view
        - ${env.PR_ID}
        - --json
        - state,headRefName,headRefOid
        - --jq
        - 'if .state == "MERGED" and .headRefName == "${params.branch}" and .headRefOid == "${env.WORKTREE_HEAD}" then .headRefOid else error("PR is not merged or does not match the local issue branch HEAD") end'
