        ## Task Contract: prepare complete commit and PR metadata

        The original commit-push contract requires a non-main branch, reviewed/cohesive
        changes, a rich conventional commit, push, and a PR. Dagu executes those mutations;
        your responsibility is to inspect actual code/evidence and prepare their metadata.
        Do not stage, commit, push, switch branches, publish comments or create a PR.
