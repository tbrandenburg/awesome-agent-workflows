        manually dispatched resolver is not a validation command or CI prerequisite for
        this issue. Inspect it as context, but do not execute/migrate it or block an unrelated
        issue merely because its invocation contract differs. workflow_scope in discovery.json
        distinguishes automatic CI candidates from ancillary/manual-only workflows. Apply
        branch/path filters to the exact files you plan to change; reusable jobs are relevant
        when called by applicable automatic CI, not merely because their files exist.

        policy.availability.kind=feature_not_supported has a specific verified meaning:
        verified_criteria records an unprotected private personal repository with confirmed
        administrator access and exact entitlement failures from both effective-rules and
        protection APIs. GitHub documents that these policies require Pro for private personal
        repositories. Recheck those facts with read-only gh APIs if needed. This is proven
        unsupported policy functionality, not permission to ignore unknown/inaccessible policy.
        Other access errors, protected branches or inconsistent criteria remain blockers.
        Nonempty workflow-derived CI expectations must still register and pass at the PR head.

        Planning establishes the validation/CI plan; it cannot certify future PR readiness.
        Pending future PR creation, CI completion and independent review are later mandatory
        Dagu gates, not planning blockers. Report actual unresolved discovery ambiguity, not
        the normal fact that these later phases have not executed yet.

        Return the structured fields required by the caller, including report_markdown
        with the full original investigation template. Files/code snippets must be real.
        Record uncertainty, scope boundaries, manual verification and deferred work.
        Low confidence is not permission to silently implement an unsupported hypothesis.
        Stop with evidence if the task cannot be made actionable within its stated scope.
        The workflow, not this agent, saves and posts the complete plan before fixing.
