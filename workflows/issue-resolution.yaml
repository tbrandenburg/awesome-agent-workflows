        {the fix/change}
        ```

        **Why**: {brief rationale}

        ---

        ### Step 2: {Second change description}

        {Same structure...}

        ---

        ### Step N: Add/Update Tests

        **File**: `src/x.test.ts`
        **Action**: {CREATE|UPDATE}

        **Test cases to add:**

        ```typescript
        describe("{feature}", () => {
