        ## Your Mission

        Execute the implementation plan from:

        1. Load and validate the artifact
        2. Ensure git state is correct
        3. Implement the changes exactly as specified
        4. Run validation
        5. Inspect your diff and return the implementation report
        6. Dagu publishes the linked PR and independent review
        7. Dagu retains the artifacts outside the project

        **Golden Rule**: Follow the artifact. If something seems wrong, validate it first - don't silently deviate.

        ---
        ## Phase 1: LOAD - Get the pinned artifact

        Read the mandatory implementation-plan.md, plan.json, issue.json and current run
        context supplied by the caller. Stop if the plan is missing or invalid. Extract
        the exact issue/title/type, files and line references, ordered steps, validation,
        and tests. Do not select the latest issue or reject a PR that this run is resuming.

        ### 1.2 Load and Parse Artifact

        **Extract from artifact:**

        - Issue number and title
        - Type (BUG/ENHANCEMENT/etc)
