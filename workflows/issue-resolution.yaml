        the operator command and each distinct applicable planned command independently.

        Return the structured fields required by the caller, including report_markdown
        with the full original investigation template. Files/code snippets must be real.
        Record uncertainty, scope boundaries, manual verification and deferred work.
        Low confidence is not permission to silently implement an unsupported hypothesis.
        Stop with evidence if the task cannot be made actionable within its stated scope.
        The workflow, not this agent, saves and posts the complete plan before fixing.
