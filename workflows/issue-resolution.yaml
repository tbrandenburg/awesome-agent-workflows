description: Manually resolve one GitHub issue using persistent isolated worktrees.
type: graph
timeout_sec: 3600
dotenv: ${params.deployment_env_file}
secrets:
  - name: GH_TOKEN
    provider: env
    key: GH_TOKEN
  - name: TELEGRAM_BOT_TOKEN
    provider: env
    key: TELEGRAM_BOT_TOKEN
  - name: TELEGRAM_CHAT_ID
    provider: env
    key: TELEGRAM_CHAT_ID
artifacts:
  enabled: true
params:
  - name: deployment_env_file
    type: string
    default: /var/lib/dagu/issue-resolver.env
    description: Optional deployment dotenv path; runners supply an empty file and inject credentials as environment secrets.
  - name: workspace_root
    type: string
    default: /var/lib/dagu/workspaces
    description: Absolute writable workspace; override on runners with RUNNER_TEMP/resolver.
  - name: workspace_mode
    type: string
    enum: [persistent, ephemeral]
    default: persistent
  - name: git_author_name
    type: string
    default: Dagu Issue Resolver
  - name: git_author_email
    type: string
    default: dagu-resolver@users.noreply.github.com
  - name: repository
    type: string
    required: true
    pattern: '^[A-Za-z0-9_-]+/[A-Za-z0-9_.-]+$'
  - name: issue_number
    type: integer
    default: 0
    minimum: 0
    description: Zero selects an open issue, preferring an existing resolver PR.
  - name: base_branch
    type: string
    default: ''
  - name: validation_command
    type: string
    required: true
    min_length: 1
    description: Trusted operator-supplied real test command, executed in the issue worktree.
  - name: auto_merge
    type: boolean
    default: true
  - name: required_checks
    type: string
    default: ''
    description: Comma-separated exact GitHub check names which must register and pass.
  - name: allow_no_ci
    type: boolean
    default: false
    description: Explicit opt-in for repositories without CI; never ignores present failing checks.
consts:
  - economy: '["openai/gpt-6-luna","github-copilot/gpt-6-luna","anthropic/claude-haiku-5-5","github-copilot/claude-haiku-5.5","openrouter/openai/gpt-6-luna","opencode/big-pickle"]'
  - balanced: '["openai/gpt-6.1-sol","github-copilot/gpt-6.1-sol","anthropic/claude-sonnet-5-5","github-copilot/claude-sonnet-5.5","openrouter/openai/gpt-6.1-sol","opencode/big-pickle"]'
  - premium: '["openai/gpt-6-astra","github-copilot/gpt-6-astra","anthropic/claude-opus-5-5","github-copilot/claude-opus-5.5","openrouter/openai/gpt-6-astra","openrouter/anthropic/claude-opus-5.5","opencode/big-pickle"]'
env:
  - RESOLVER_WORKSPACE_ROOT: ${params.workspace_root}
  - ECONOMY_CANDIDATES: ${consts.economy}
  - BALANCED_CANDIDATES: ${consts.balanced}
  - PREMIUM_CANDIDATES: ${consts.premium}
  - WORKSPACE_MODE: ${params.workspace_mode}
  - GIT_AUTHOR_NAME: ${params.git_author_name}
  - GIT_AUTHOR_EMAIL: ${params.git_author_email}
  - GIT_COMMITTER_NAME: ${params.git_author_name}
  - GIT_COMMITTER_EMAIL: ${params.git_author_email}
  - PYTHONDONTWRITEBYTECODE: '1'
  - HELPER: ${context.paths.artifacts_dir}/resolver.py
  - STATE: ${context.paths.artifacts_dir}/context.json
  - RUN_ID: ${context.run.id}
handler_on:
  exit:
    run: python3 "$HELPER" finish --state "$STATE"
steps:
  # BEGIN EMBEDDED RUNTIME
  - id: materialize_runtime
    action: file.write
    with:
      path: ${env.HELPER}
      create_dirs: true
      content: |
        # Generated self-contained resolver runtime; Python standard library only.
        import json
        import os
        import re
        import subprocess
        from pathlib import Path
        import shutil
        import sys
        from typing import Callable
        import argparse
        import tarfile
        import shlex
        import tomllib
        import time
        import hashlib
        import html
        import urllib.error
        import urllib.parse
        import urllib.request
        ROOT = Path(os.environ.get('RESOLVER_WORKSPACE_ROOT', '/var/lib/dagu/workspaces'))

        def redact(text: str) -> str:
            for key in ('OPENAI_API_KEY', 'ANTHROPIC_API_KEY', 'OPENROUTER_API_KEY', 'GH_TOKEN', 'TELEGRAM_BOT_TOKEN', 'TELEGRAM_CHAT_ID'):
                value = os.environ.get(key)
                if value:
                    text = text.replace(value, '[REDACTED]')
            return text

        def execute(args: list[str], cwd: str | Path | None=None, timeout: int=90) -> str:
            result = subprocess.run(args, cwd=cwd, capture_output=True, text=True, timeout=timeout)
            if result.returncode:
                raise RuntimeError(f'{args[0]} failed (exit {result.returncode}): {redact(result.stderr[-2000:])}')
            return redact(result.stdout.strip())

        def gh(*args: str) -> object:
            return json.loads(execute(['gh', *args]))

        def git(context: dict, *args: str, checkout: bool=False) -> str:
            return execute(['git', '-c', 'credential.helper=', '-c', 'credential.helper=!gh auth git-credential', '-c', 'credential.useHttpPath=true', *args], context['checkout' if checkout else 'worktree'])

        def load(path: Path) -> dict:
            return json.loads(path.read_text())

        def agent_object(raw: str, required: set[str]) -> dict:
            candidates = []
            for index, character in enumerate(raw):
                if character != '{':
                    continue
                try:
                    value, _ = json.JSONDecoder().raw_decode(raw[index:])
                except json.JSONDecodeError:
                    continue
                if isinstance(value, dict) and required.issubset(value):
                    candidates.append(value)
            if len(candidates) != 1:
                raise ValueError('Agent must return exactly one JSON object matching the required schema')
            return candidates[0]

        def save(path: Path, context: dict) -> dict:
            path.parent.mkdir(parents=True, exist_ok=True)
            temporary = path.with_suffix('.new')
            temporary.write_text(json.dumps(context, indent=2) + '\n')
            temporary.replace(path)
            return context

        def repository(value: str) -> str:
            if not re.fullmatch('[A-Za-z0-9_-]+/[A-Za-z0-9_.-]+', value):
                raise ValueError('repository must be owner/name')
            if value.split('/')[1] in ('.', '..'):
                raise ValueError('invalid repository name')
            return value

        def claim(path: Path, token: str) -> None:
            path.parent.mkdir(parents=True, exist_ok=True)
            try:
                path.mkdir()
            except FileExistsError as error:
                raise RuntimeError(f'Repository busy or stale lease: {path}; inspect owner.json before recovery') from error
            (path / 'owner.json').write_text(json.dumps({'run': token}))

        def release(context: dict) -> None:
            lease = Path(context['lease'])
            owner = lease / 'owner.json'
            if not owner.exists() or load(owner).get('run') != context['run']:
                return
            owner.unlink()
            lease.rmdir()

        def pull_request(context: dict) -> dict:
            return gh('pr', 'view', str(context['pr']), '--repo', context['repository'], '--json', 'number,url,state,headRefName,headRefOid,baseRefName,isDraft,mergeable,reviewDecision,statusCheckRollup,mergedAt')

        def verify_pr(context: dict, pr: dict, field: str) -> None:
            if pr['state'] != 'OPEN' or pr['baseRefName'] != context['base'] or pr['headRefName'] != context['branch']:
                raise RuntimeError('PR was closed, retargeted, or changed branches after selection')
            if pr['headRefOid'] != context[field]:
                raise RuntimeError('PR HEAD changed after verification; refusing stale evidence')

        def assert_head(context: dict, field: str) -> dict:
            pr = pull_request(context)
            verify_pr(context, pr, field)
            if git(context, 'rev-parse', 'HEAD') != context[field]:
                raise RuntimeError('PR/local HEAD changed after verification; refusing stale evidence')
            return pr

        def workspace(value: str) -> Path:
            path = Path(value).expanduser()
            if not path.is_absolute() or path == Path(path.anchor):
                raise ValueError('workspace_root must be a non-root absolute directory')
            for parent in [path, *path.parents]:
                if parent.is_symlink():
                    raise ValueError('workspace_root cannot traverse symlinks')
            return path

        def preflight(root: Path, mode: str, author: str, email: str) -> None:
            workspace(str(root))
            if mode not in ('persistent', 'ephemeral'):
                raise ValueError('workspace_mode must be persistent or ephemeral')
            if sys.version_info < (3, 11):
                raise RuntimeError('Python 3.11+ is required')
            for binary in ('git', 'gh', 'bash', 'opencode'):
                if not shutil.which(binary):
                    raise RuntimeError(f'Required tool missing: {binary}')
            for key in ('GH_TOKEN', 'TELEGRAM_BOT_TOKEN', 'TELEGRAM_CHAT_ID'):
                if not os.environ.get(key):
                    raise RuntimeError(f'Required credential missing: {key} (value withheld)')
            if not author.strip() or '\n' in author or (not re.fullmatch('[^\\s@]+@[^\\s@]+', email)):
                raise ValueError('Provide a valid git_author_name and git_author_email')
            result = subprocess.run(['opencode', '--version'], capture_output=True, text=True, timeout=15)
            if result.returncode or not re.search('\\bv?2\\.', result.stdout):
                raise RuntimeError('OpenCode V2 must be installed')
            existing = next((parent for parent in [root, *root.parents] if parent.exists()))
            if not existing.is_dir() or not os.access(existing, os.W_OK | os.X_OK):
                raise ValueError('Workspace parent is not writable')

        def auth_providers(items: object) -> set[str]:
            if not isinstance(items, list):
                raise ValueError('Unexpected OpenCode auth metadata shape')
            providers = set()
            for item in items:
                if not isinstance(item, dict) or not isinstance(item.get('id'), str) or (not isinstance(item.get('connections'), list)):
                    raise ValueError('Invalid OpenCode auth integration metadata')
                if any((isinstance(connection, dict) and connection.get('type') in ('credential', 'env') for connection in item['connections'])):
                    providers.add(item['id'])
            return providers

        def resolve_tier(candidates: list[str], auth: set[str], catalog: set[str], probe: Callable[[str], str]) -> dict:
            attempts = []
            for model in candidates:
                provider = model.split('/', 1)[0]
                if provider not in auth and model != 'opencode/big-pickle':
                    attempts.append({'model': model, 'result': 'no_auth_metadata'})
                    continue
                if model not in catalog:
                    attempts.append({'model': model, 'result': 'not_in_catalog'})
                    continue
                outcome = probe(model)
                attempts.append({'model': model, 'result': outcome})
                if outcome == 'ready':
                    return {'selected': model, 'degraded': model == 'opencode/big-pickle', 'attempts': attempts}
                if outcome != 'auth_or_model_unavailable':
                    raise RuntimeError(f'Model readiness failed for {model}: {outcome}; no silent downgrade')
            raise RuntimeError('No authenticated and usable model remains in the tier')

        def metadata(args: list[str]) -> str:
            result = subprocess.run(['opencode', *args, '--standalone'], cwd=ROOT, capture_output=True, text=True, timeout=60)
            if result.returncode:
                raise RuntimeError('OpenCode metadata command failed; output withheld')
            return result.stdout

        def readiness(model: str) -> str:
            try:
                result = subprocess.run(['opencode', 'run', '--standalone', '--agent', 'build', '--model', model, '--auto', 'Readiness check only. Reply exactly MODEL_READY. Do not call tools, read files, modify files, or delegate.'], cwd=ROOT, capture_output=True, text=True, timeout=120)
            except subprocess.TimeoutExpired:
                return 'timeout'
            if result.returncode == 0 and re.search('(?m)^MODEL_READY\\s*$', result.stdout):
                return 'ready'
            errors = result.stdout + result.stderr
            if re.search('unauthorized|authentication|not logged in|api.key.*(?:missing|invalid)|invalid.*api.key|model.*(?:not supported|not available|not found)|requested model is not available|access.*denied|insufficient.*quota|credit.*balance', errors, re.IGNORECASE):
                return 'auth_or_model_unavailable'
            return 'request_failed' if result.returncode else 'unexpected_reply'

        def resolve_models(path: Path) -> dict:
            context = load(path)
            definitions = {tier: json.loads(os.environ[f'{tier.upper()}_CANDIDATES']) for tier in ('economy', 'balanced', 'premium')}
            if any((not isinstance(items, list) or not items or any((not isinstance(model, str) or '/' not in model for model in items)) for items in definitions.values())):
                raise ValueError('Each model tier needs an ordered nonempty candidate list')
            auth = auth_providers(json.loads(metadata(['auth', 'list', '--format', 'json'])))
            catalog = set(metadata(['models']).splitlines())
            cache = {}

            def probe(model: str) -> str:
                if model not in cache:
                    cache[model] = readiness(model)
                return cache[model]
            choices = {}
            evidence = {'authenticated_providers': sorted(auth), 'tiers': choices, 'premium': {'candidates': definitions['premium'], 'used': False}}
            try:
                for tier in ('economy', 'balanced'):
                    choices[tier] = resolve_tier(definitions[tier], auth, catalog, probe)
            except RuntimeError as error:
                evidence['error'] = str(error)
                (path.parent / 'model-selection.json').write_text(json.dumps(evidence, indent=2))
                context['phase'] = 'model_selection_failed'
                save(path, context)
                raise
            (path.parent / 'model-selection.json').write_text(json.dumps(evidence, indent=2))
            context.update(models={tier: choice['selected'] for tier, choice in choices.items()}, phase='models_resolved')
            return save(path, context)

        def run_agent() -> int:
            parser = argparse.ArgumentParser(description=__doc__)
            parser.add_argument('--model', required=True)
            parser.add_argument('--agent', default='build')
            parser.add_argument('--auto', action='store_true')
            parser.add_argument('prompt')
            args = parser.parse_args(sys.argv[2:])
            command = ['opencode', 'run', '--standalone', '--model', args.model, '--agent', args.agent]
            if args.auto:
                command.append('--auto')
            command.append(args.prompt)
            try:
                result = subprocess.run(command, capture_output=True, text=True, timeout=1200)
            except subprocess.TimeoutExpired:
                print('Agent request timed out; no model fallback after implementation started', file=sys.stderr)
                return 1
            sys.stdout.write(redact(result.stdout))
            sys.stderr.write(redact(result.stderr))
            return result.returncode

        def safe_source(name: str) -> bool:
            path = Path(name)
            if path.is_absolute() or '..' in path.parts:
                return False
            return not any((part.startswith('.env') or part.lower() in ('credentials', 'secrets', '.git') or Path(part).suffix.lower() in ('.pem', '.key', '.p12', '.pfx') for part in path.parts))

        def secret_content(content: bytes) -> bool:
            if any((value and len(value) >= 12 and (value.encode() in content) for value in (os.environ.get(key, '') for key in ('GH_TOKEN', 'OPENAI_API_KEY', 'ANTHROPIC_API_KEY', 'OPENROUTER_API_KEY', 'TELEGRAM_BOT_TOKEN')))):
                return True
            return bool(re.search(b'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|(?:ghp_|github_pat_|sk-)[A-Za-z0-9_-]{20,}', content))

        def recovery(path: Path) -> None:
            context = load(path)
            if context.get('workspace_mode') != 'ephemeral' or context.get('merged') or (not context.get('worktree')):
                return
            tree = Path(context['worktree'])
            if not tree.is_dir():
                return
            if any((parent.is_symlink() for parent in [tree, *tree.parents])):
                raise RuntimeError('Refusing recovery through a symlinked worktree or ancestor')
            canonical = tree.resolve()
            files = git(context, 'diff', '--name-only', 'HEAD').splitlines()
            eligible = [name for name in files if safe_source(name)]
            patch = git(context, 'diff', '--binary', 'HEAD', '--', *eligible) if eligible else ''
            sensitive = secret_content(patch.encode())
            untracked = git(context, 'ls-files', '--others', '--exclude-standard').splitlines()
            included = []
            with tarfile.open(path.parent / 'unfinished-source.tar.gz', 'w:gz') as archive:
                for name in untracked:
                    source = tree / name
                    if not safe_source(name) or source.is_symlink() or (not source.is_file()):
                        continue
                    if not source.resolve().is_relative_to(canonical) or any((parent.is_symlink() for parent in source.parents)):
                        continue
                    if secret_content(source.read_bytes()):
                        sensitive = True
                        continue
                    archive.add(source, arcname=name, recursive=False)
                    included.append(name)
            if sensitive:
                (path.parent / 'unfinished-source.tar.gz').unlink(missing_ok=True)
                (path.parent / 'unfinished.patch').unlink(missing_ok=True)
                (path.parent / 'recovery.json').write_text(json.dumps({'withheld': True, 'note': 'Recovery source withheld: credential-like content detected. No matching value or source content was logged.'}, indent=2))
                return
            (path.parent / 'unfinished.patch').write_text(patch + '\n')
            (path.parent / 'recovery.json').write_text(json.dumps({'repository': context['repository'], 'issue': context['issue'], 'branch': context['branch'], 'head': git(context, 'rev-parse', 'HEAD'), 'patch_paths': eligible, 'untracked_paths': included, 'excluded_paths': [name for name in [*files, *untracked] if not safe_source(name)], 'note': 'Published commits resume from remote branch/PR. Uncommitted source requires applying downloaded recovery artifacts; no unvalidated commit was pushed.'}, indent=2))
        ALIASES = {'typecheck': {'typecheck', 'type-check', 'check-types', 'types'}, 'lint': {'lint', 'format:check', 'format-check', 'lint:check'}, 'tests': {'test', 'test:unit', 'test-unit', 'test:all'}, 'build': {'build', 'build:production'}}

        def catalog(directory: Path) -> dict[str, list[list[str]]]:
            result: dict[str, list[list[str]]] = {kind: [] for kind in ALIASES}
            manifest = directory / 'package.json'
            if manifest.is_file():
                scripts = json.loads(manifest.read_text()).get('scripts', {})
                manager = 'pnpm' if (directory / 'pnpm-lock.yaml').exists() else 'yarn' if (directory / 'yarn.lock').exists() else 'bun' if (directory / 'bun.lock').exists() or (directory / 'bun.lockb').exists() else 'npm'
                for kind, names in ALIASES.items():
                    for name in sorted(names & scripts.keys()):
                        if isinstance(scripts[name], str):
                            result[kind].append([manager, 'run', name])
            makefile = directory / 'Makefile'
            if makefile.is_file():
                targets = set(re.findall('^([A-Za-z0-9_.-]+)\\s*:(?!=)', makefile.read_text(), re.MULTILINE))
                for kind, names in ALIASES.items():
                    for name in sorted(names & targets):
                        result[kind].append(['make', name])
            project = directory / 'pyproject.toml'
            python = tomllib.loads(project.read_text()) if project.is_file() else {}
            tools = python.get('tool', {})
            if 'mypy' in tools or (directory / 'mypy.ini').is_file():
                result['typecheck'].append(['python3', '-m', 'mypy', '.'])
            if 'ruff' in tools or any(((directory / name).is_file() for name in ('ruff.toml', '.ruff.toml'))):
                result['lint'].extend([['ruff', 'check', '.'], ['ruff', 'format', '--check', '.']])
            if 'pytest' in tools or (directory / 'pytest.ini').is_file():
                result['tests'].append(['python3', '-m', 'pytest'])
            if 'build-system' in python:
                result['build'].append(['python3', '-m', 'build'])
            if (directory / 'Cargo.toml').is_file():
                for kind, argv in {'typecheck': ['cargo', 'check'], 'lint': ['cargo', 'clippy'], 'tests': ['cargo', 'test'], 'build': ['cargo', 'build']}.items():
                    result[kind].append(argv)
            if (directory / 'go.mod').is_file():
                for kind, argv in {'typecheck': ['go', 'vet', './...'], 'tests': ['go', 'test', './...'], 'build': ['go', 'build', './...']}.items():
                    result[kind].append(argv)
            return result

        def resolve(command: str, kind: str, directory: Path, operator: str) -> list[str] | None:
            if command == operator or shlex.split(command) == shlex.split(operator):
                return None
            argv = shlex.split(command)
            if argv not in catalog(directory)[kind]:
                raise ValueError(f'Unapproved planned {kind} command; choose a catalog entry or include it in the operator command')
            return argv
        KINDS = {'typecheck', 'lint', 'tests', 'build'}

        def validate_checks(checks: object, directory: Path | None=None) -> None:
            if not isinstance(checks, list) or len(checks) != len(KINDS):
                raise ValueError('Plan must classify typecheck, lint, tests and build')
            if {item.get('kind') for item in checks if isinstance(item, dict)} != KINDS:
                raise ValueError('Plan check categories must be unique and complete')
            for item in checks:
                if not isinstance(item.get('command'), str) or not isinstance(item.get('reason'), str) or (not item['reason'].strip()):
                    raise ValueError('Every check needs a command or a justified N/A reason')
            tests = next((item for item in checks if item['kind'] == 'tests'))
            if not tests['command'].strip():
                raise ValueError('Tests cannot be marked not applicable')
            if directory is not None:
                available = catalog(directory)
                for item in checks:
                    if not item['command'].strip() and available[item['kind']]:
                        raise ValueError(f'Cataloged {item['kind']} check cannot be marked not applicable')

        def run_checks(context: dict, directory: str, artifact: Path, prefix: str) -> list[dict]:
            if not context.get('planned'):
                raise RuntimeError('A validated published plan is required before validation/publication')
            checks = context['validation_checks']
            validate_checks(checks, Path(directory))
            commands = list(dict.fromkeys([context['validation'], *[item['command'] for item in checks if item['command'].strip()]]))
            results = []
            logs = []
            for command in commands:
                entry = next((item for item in checks if item['command'] == command), {'kind': 'tests'})
                approved = resolve(command, entry['kind'], Path(directory), context['validation'])
                argv = approved if approved is not None else ['bash', '-o', 'pipefail', '-c', context['validation']]
                result = subprocess.run(argv, cwd=directory, capture_output=True, text=True, timeout=600)
                results.append({'command': redact(command), 'exit_code': result.returncode})
                logs.append(redact(f'$ {command}\nexit_code={result.returncode}\n{result.stdout}{result.stderr}\n'))
            (artifact / f'{prefix}.log').write_text('\n'.join(logs))
            (artifact / f'{prefix}-results.json').write_text(json.dumps({'checks': checks, 'commands': results}, indent=2))
            failed = [item for item in results if item['exit_code']]
            if failed:
                raise RuntimeError(f'{len(failed)} validation command(s) failed; exit {failed[0]['exit_code']}; see {prefix}.log')
            return results

        def assess(checks: list[dict], required: list[str], allow_no_ci: bool) -> bool:
            if not required and (not allow_no_ci):
                raise ValueError('No CI policy configured')
            names = {check.get('name', check.get('context')) for check in checks}
            pending = not set(required).issubset(names)
            for check in checks:
                name = check.get('name', check.get('context'))
                conclusion = check.get('conclusion')
                state = check.get('state')
                if conclusion not in (None, '', 'SUCCESS', 'SKIPPED', 'NEUTRAL') or state in ('FAILURE', 'ERROR'):
                    raise RuntimeError('GitHub CI failed; inspect PR checks before repairing')
                if check.get('status') not in (None, 'COMPLETED') or state in ('PENDING', 'EXPECTED'):
                    pending = True
                if name in required and conclusion != 'SUCCESS' and (state != 'SUCCESS'):
                    pending = True
            return not pending

        def ci_gate(path: Path) -> dict:
            context = load(path)
            deadline = time.monotonic() + 180
            while True:
                pr = assert_head(context, 'reviewed_sha')
                checks = pr['statusCheckRollup'] or []
                try:
                    ready = assess(checks, context['required_checks'], context['allow_no_ci'])
                except RuntimeError:
                    context.update(phase='ci_failed', blocker='GitHub CI has failing checks; see PR check logs')
                    save(path, context)
                    raise
                if ready and pr['mergeable'] != 'UNKNOWN':
                    break
                if time.monotonic() >= deadline:
                    context.update(phase='ci_failed', blocker='Required GitHub CI checks missing or pending beyond the bounded wait')
                    save(path, context)
                    raise RuntimeError('Required CI checks missing/pending, or mergeability unknown after 180 seconds')
                time.sleep(5)
            if pr['mergeable'] != 'MERGEABLE' or pr['reviewDecision'] == 'CHANGES_REQUESTED' or pr['isDraft']:
                context.update(phase='merge_blocked', blocker='GitHub PR is conflicting, draft, or has requested changes')
                save(path, context)
                raise RuntimeError('PR is blocked, conflicting, draft, or has requested changes')
            context.update(ci_sha=context['head'], phase='ready', ci_checks=len(checks))
            return save(path, context)

        def managed_configuration(value: object) -> bool:
            if not isinstance(value, dict) or set(value) != {'experimental', 'providers'} or value['experimental'] != {'todo': True}:
                return False
            providers = value['providers']
            if not isinstance(providers, dict):
                return False
            keys = {'openai': 'OPENAI_API_KEY', 'anthropic': 'ANTHROPIC_API_KEY', 'openrouter': 'OPENROUTER_API_KEY'}
            return all((provider in keys and settings == {'settings': {'apiKey': '{env:' + keys[provider] + '}'}} for provider, settings in providers.items()))

        def prepare(path: Path) -> dict:
            repo = repository(os.environ['REPOSITORY'])
            issue = int(os.environ['ISSUE_NUMBER'])
            if issue < 0:
                raise ValueError('issue_number cannot be negative')
            validation = os.environ['VALIDATION_COMMAND'].strip()
            if not validation:
                raise ValueError('validation_command must be an explicit real project test command')
            required_checks = [item.strip() for item in os.environ['REQUIRED_CHECKS'].split(',') if item.strip()]
            allow_no_ci = os.environ['ALLOW_NO_CI'] == 'true'
            if not required_checks and (not allow_no_ci):
                raise ValueError('Specify required_checks or explicitly set allow_no_ci=true')
            mode = os.environ.get('WORKSPACE_MODE', 'persistent')
            author = os.environ.get('GIT_AUTHOR_NAME', 'Dagu Issue Resolver')
            email = os.environ.get('GIT_AUTHOR_EMAIL', 'dagu-resolver@users.noreply.github.com')
            preflight(ROOT, mode, author, email)
            checkout = str(ROOT / 'repos' / repo)
            metadata = gh('api', f'repos/{repo}')
            repo = repository(metadata['full_name'])
            base = os.environ['BASE_BRANCH'] or metadata['default_branch']
            execute(['git', 'check-ref-format', '--branch', base])
            context = {'repository': repo, 'issue': issue, 'base': base, 'checkout': checkout, 'url': metadata['clone_url'], 'lease': str(ROOT / 'leases' / repo), 'run': os.environ['RUN_ID'], 'validation': validation, 'auto_merge': os.environ['AUTO_MERGE'] == 'true', 'required_checks': required_checks, 'allow_no_ci': allow_no_ci, 'merged': False, 'planned': False, 'phase': 'prepared', 'artifact_dir': str(path.parent), 'workspace_root': str(ROOT), 'workspace_mode': mode, 'author_name': author, 'author_email': email}
            for item in [ROOT, ROOT / 'repos', ROOT / 'worktrees', ROOT / 'leases']:
                if item.is_symlink():
                    raise ValueError('Workspace roots must not be symlinks')
            save(path, context)
            claim(Path(context['lease']), context['run'])
            configuration = ROOT / 'opencode.json'
            providers = {}
            for provider, key in (('openai', 'OPENAI_API_KEY'), ('anthropic', 'ANTHROPIC_API_KEY'), ('openrouter', 'OPENROUTER_API_KEY')):
                if os.environ.get(key):
                    providers[provider] = {'settings': {'apiKey': '{env:' + key + '}'}}
            proposed = {'experimental': {'todo': True}, 'providers': providers}
            legacy_models = {json.loads(os.environ[f'{tier}_CANDIDATES'])[0].split('/', 1)[1]: {'modelID': json.loads(os.environ[f'{tier}_CANDIDATES'])[0].split('/', 1)[1]} for tier in ('ECONOMY', 'BALANCED')}
            legacy = {'experimental': {'todo': True}, 'providers': {'openai': {'settings': {'apiKey': '{env:OPENAI_API_KEY}'}, 'models': legacy_models}}}
            if configuration.is_symlink():
                raise RuntimeError('Workspace OpenCode configuration must not be a symlink')
            if configuration.exists():
                current = json.loads(configuration.read_text())
                if current not in (proposed, legacy) and (not managed_configuration(current)):
                    raise RuntimeError('Workspace OpenCode configuration differs; refusing to overwrite it')
            configuration.write_text(json.dumps(proposed, indent=2) + '\n')
            Path(context['checkout']).parent.mkdir(parents=True, exist_ok=True)
            return context

        def select(path: Path) -> dict:
            context = load(path)
            repo = context['repository']
            git(context, 'config', 'user.name', context['author_name'], checkout=True)
            git(context, 'config', 'user.email', context['author_email'], checkout=True)
            context['base_sha'] = git(context, 'rev-parse', f'origin/{context['base']}', checkout=True)
            prs = gh('pr', 'list', '--repo', repo, '--state', 'open', '--limit', '1000', '--json', 'number,headRefName,headRepositoryOwner,isCrossRepository,baseRefName,body')
            if len(prs) == 1000:
                raise RuntimeError('PR scan reached 1000; select an issue explicitly after reducing scope')
            if not context['issue']:
                issues = gh('issue', 'list', '--repo', repo, '--state', 'open', '--limit', '1000', '--json', 'number,createdAt')
                if len(issues) == 1000:
                    raise RuntimeError('Issue scan reached 1000; provide issue_number')
                branches = {pr['headRefName'] for pr in prs}
                candidates = sorted(issues, key=lambda issue: (f'resolver/issue-{issue['number']}' not in branches, issue['createdAt']))
                if not candidates:
                    context.update(phase='no_work', branch='', worktree='')
                    return save(path, context)
                context['issue'] = candidates[0]['number']
            issue = gh('issue', 'view', str(context['issue']), '--repo', repo, '--json', 'number,title,body,state,url,comments')
            if issue['state'] != 'OPEN':
                raise ValueError('Selected issue is not open')
            branch = f'resolver/issue-{context['issue']}'
            closing = gh('api', 'graphql', '-f', 'query=query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){issue(number:$number){closedByPullRequestsReferences(first:100){nodes{number state}}}}}', '-f', f'owner={repo.split('/')[0]}', '-f', f'name={repo.split('/')[1]}', '-F', f'number={context['issue']}')
            linked = {pr['number'] for pr in closing['data']['repository']['issue']['closedByPullRequestsReferences']['nodes'] if pr['state'] == 'OPEN'}
            matches = [pr for pr in prs if pr['headRefName'] == branch or pr['number'] in linked]
            if len(matches) > 1:
                raise RuntimeError('Multiple candidate PRs; resolve ambiguity before running')
            if matches:
                pr = matches[0]
                if pr['isCrossRepository'] or pr['baseRefName'] != context['base']:
                    raise RuntimeError('Existing PR must be in this repository and target the configured base')
                branch = pr['headRefName']
                execute(['git', 'check-ref-format', '--branch', branch])
                context['pr'] = pr['number']
            context.update(branch=branch, worktree=str(ROOT / 'worktrees' / repo / f'issue-{context['issue']}'), phase='selected', issue_url=issue['url'], title=issue['title'])
            Path(context['worktree']).parent.mkdir(parents=True, exist_ok=True)
            if not Path(context['worktree']).exists():
                remote = git(context, 'branch', '--remotes', '--list', f'origin/{branch}', checkout=True)
                local = git(context, 'branch', '--list', branch, checkout=True)
                if remote and (not local):
                    git(context, 'branch', branch, f'origin/{branch}', checkout=True)
            (path.parent / 'issue.json').write_text(__import__('json').dumps(issue, indent=2))
            return save(path, context)

        def snapshot(path: Path) -> dict:
            context = load(path)
            if git(context, 'branch', '--show-current') != context['branch']:
                raise RuntimeError('Unexpected worktree branch')
            context.update(previous_phase=context.get('phase'), phase='worktree_ready')
            if 'planning_head' not in context:
                context.update(planning_head=git(context, 'rev-parse', 'HEAD'), planning_status=git(context, 'status', '--porcelain'), planning_diff=hashlib.sha256(git(context, 'diff', '--binary', 'HEAD').encode()).hexdigest())
            return save(path, context)

        def validate_plan(report: dict, validation: str) -> None:
            if not isinstance(report.get('summary'), str) or not report['summary'].strip():
                raise ValueError('Planning summary must be nonempty')
            for field in ('files', 'steps', 'risks'):
                items = report.get(field)
                if not isinstance(items, list) or any((not isinstance(item, str) or not item.strip() for item in items)):
                    raise ValueError(f'Planning {field} must be a list of nonempty strings')
                if field != 'risks' and (not items):
                    raise ValueError(f'Planning {field} cannot be empty')
            if report.get('validation') != validation:
                raise ValueError('Planning must preserve the operator validation command')
            if not isinstance(report.get('report_markdown'), str) or not report['report_markdown'].strip():
                raise ValueError('Planning requires the full original investigation report')
            validate_checks(report.get('checks'))

        def record_plan(path: Path) -> dict:
            context = load(path)
            raw = sys.stdin.read()
            (path.parent / 'planning-agent.txt').write_text(raw)
            report = agent_object(raw, {'summary', 'files', 'steps', 'risks', 'validation', 'checks', 'report_markdown'})
            validate_plan(report, context['validation'])
            validate_checks(report['checks'], Path(context['worktree']))
            for check in report['checks']:
                if check['command'].strip():
                    resolve(check['command'], check['kind'], Path(context['worktree']), context['validation'])
            if git(context, 'rev-parse', 'HEAD') != context['planning_head'] or git(context, 'status', '--porcelain') != context['planning_status'] or hashlib.sha256(git(context, 'diff', '--binary', 'HEAD').encode()).hexdigest() != context['planning_diff']:
                raise RuntimeError('Planning changed the worktree; implementation blocked')
            (path.parent / 'plan.json').write_text(json.dumps(report, indent=2))
            body = report['report_markdown'] + '\n\n' + (f'## Dagu implementation plan\n\nIssue: #{context['issue']}\nInvestigated commit: `{context['planning_head']}`\n\n{report['summary']}\n\n### Files and changes\n' + '\n'.join((f'- {item}' for item in report['files'])) + '\n\n### Implementation and tests\n' + '\n'.join((f'{index}. {item}' for index, item in enumerate(report['steps'], 1))) + '\n\n### Risks and edge cases\n' + '\n'.join((f'- {item}' for item in report['risks'])) + '\n\n### Validation\n```sh\n' + report['validation'] + '\n```\n')
            artifact = path.parent / 'implementation-plan.md'
            artifact.write_text(body)
            execute(['gh', 'issue', 'comment', str(context['issue']), '--repo', context['repository'], '--body-file', str(artifact)])
            context.update(planned=True, phase='planned', validation_checks=report['checks'])
            return save(path, context)

        def record_implementation(path: Path) -> dict:
            context = load(path)
            report = agent_object(sys.stdin.read(), {'status', 'report_markdown', 'deviations'})
            if not isinstance(report.get('report_markdown'), str) or not report['report_markdown'].strip():
                raise ValueError('Implementation report cannot be empty')
            (path.parent / 'implementation-report.md').write_text(report['report_markdown'] + '\n')
            if report['status'] != 'ready' or not isinstance(report['deviations'], list):
                raise RuntimeError('Implementation is blocked or its report is invalid')
            return context

        def validate_publication(metadata: dict) -> None:
            for field in ('subject', 'body', 'pr_title', 'pr_body'):
                if not isinstance(metadata.get(field), str) or not metadata[field].strip():
                    raise ValueError(f'Publication {field} is required')
            if len(metadata['subject']) >= 72 or not re.fullmatch('(?:feat|fix|refactor|docs|test|chore|perf|style)\\([A-Za-z0-9_./-]+\\): [^\\n]+', metadata['subject']):
                raise ValueError('Commit subject must be conventional type(scope), under 72 characters')
            for heading in ('## Problem', '## Solution', '## Changes', '## Testing', '## Notes'):
                if heading not in metadata['pr_body']:
                    raise ValueError(f'Rich PR description missing {heading}')

        def record_publication(path: Path) -> dict:
            context = load(path)
            metadata = agent_object(sys.stdin.read(), {'subject', 'body', 'pr_title', 'pr_body'})
            validate_publication(metadata)
            (path.parent / 'publication.json').write_text(json.dumps(metadata, indent=2))
            return context

        def diagnose(path: Path) -> dict:
            context = load(path)
            (path.parent / 'check-catalog.json').write_text(json.dumps(catalog(Path(context['worktree'])), indent=2))
            feedback: dict = {'repair_needed': False, 'checks': [], 'findings': [], 'logs': []}

            def task(reason: str) -> None:
                feedback['repair_needed'] = True
                feedback.setdefault('reasons', []).append(reason)
            if context.get('previous_phase') == 'validation_failed':
                task('Previous deterministic validation failed; inspect validation.log')
            reportfile = path.parent / 'review.json'
            if reportfile.exists():
                report = load(reportfile)
                for finding in report.get('findings', []):
                    if finding.get('severity') in ('high', 'critical'):
                        feedback['findings'].append(finding)
                        task(finding['message'])
            if context.get('pr'):
                pr = pull_request(context)
                if pr['state'] != 'OPEN' or pr['baseRefName'] != context['base'] or pr['headRefName'] != context['branch']:
                    raise RuntimeError('Pinned PR changed state/base/branch; refusing repair')
                feedback['pr'] = pr
                feedback['discussion'] = gh('pr', 'view', str(context['pr']), '--repo', context['repository'], '--json', 'comments,reviews')
                runs = set()
                for check in pr['statusCheckRollup'] or []:
                    failed = check.get('conclusion') not in (None, '', 'SUCCESS', 'SKIPPED', 'NEUTRAL') or check.get('state') in ('FAILURE', 'ERROR')
                    if not failed:
                        continue
                    feedback['checks'].append(check)
                    name = check.get('name', check.get('context', 'unknown'))
                    task(f'GitHub check {name} failed at PR head {pr['headRefOid']}')
                    match = re.search('/actions/runs/(\\d+)', check.get('detailsUrl', ''))
                    if match and match[1] not in runs:
                        runs.add(match[1])
                        logs = execute(['gh', 'run', 'view', match[1], '--repo', context['repository'], '--log-failed'], timeout=120)
                        filename = f'ci-run-{match[1]}.log'
                        (path.parent / filename).write_text(logs)
                        feedback['logs'].append(filename)
                    if not match:
                        feedback['logs'].append(f'External check {name}: inspect its details URL; no GitHub Actions run ID')
                if pr['mergeable'] == 'CONFLICTING':
                    task('GitHub reports merge conflicts against the configured base')
            (path.parent / 'repair-context.json').write_text(json.dumps(feedback, indent=2))
            context['repair_needed'] = feedback['repair_needed']
            return save(path, context)

        def blocker_key(repository: str, issue: int, reason: str) -> str:
            digest = hashlib.sha256(f'{repository}:{issue}:{reason}'.encode()).hexdigest()[:20]
            return f'<!-- dagu-blocker:{digest} -->'

        def followups(path: Path) -> dict:
            context = load(path)
            if context.get('phase') in ('merged', 'ready_for_merge', 'no_work'):
                return context
            reasons = []
            reportfile = path.parent / 'review.json'
            if reportfile.exists():
                reasons.extend((finding['message'] for finding in load(reportfile).get('findings', []) if finding.get('severity') in ('critical', 'high')))
            if context.get('phase') in ('ci_failed', 'merge_blocked', 'validation_failed'):
                reasons.append(context.get('blocker', f'Issue resolution stopped at {context['phase']}'))
            if not reasons:
                return context
            existing = gh('issue', 'list', '--repo', context['repository'], '--state', 'all', '--limit', '1000', '--json', 'number,body,state')
            if len(existing) == 1000:
                raise RuntimeError('Follow-up deduplication reached its scan limit; refusing duplicate creation')
            urls = []
            for index, reason in enumerate(dict.fromkeys(reasons), 1):
                marker = blocker_key(context['repository'], context['issue'], reason)
                matches = [issue for issue in existing if marker in (issue['body'] or '')]
                if matches:
                    issue = matches[0]
                    if issue['state'] == 'CLOSED':
                        execute(['gh', 'issue', 'reopen', str(issue['number']), '--repo', context['repository']])
                    urls.append(f'https://github.com/{context['repository']}/issues/{issue['number']}')
                    continue
                artifact = path.parent / f'blocker-{index}.md'
                artifact.write_text(f'{marker}\n\nUnresolved blocker from #{context['issue']}.\n\n{reason}\n\nRun: `{context['run']}`\nPR: {context.get('pr_url', 'not published')}\n\nTracking this issue does not permit merging the blocked PR.\n')
                url = execute(['gh', 'issue', 'create', '--repo', context['repository'], '--title', f'Unresolved blocker for #{context['issue']}: {reason[:90]}', '--body-file', str(artifact)])
                urls.append(url)
                existing.append({'number': int(url.rsplit('/', 1)[1]), 'body': marker, 'state': 'OPEN'})
            context['followups'] = urls
            return save(path, context)

        def validate(path: Path) -> dict:
            context = load(path)
            try:
                run_checks(context, context['worktree'], path.parent, 'validation')
            except (RuntimeError, subprocess.TimeoutExpired):
                context['phase'] = 'validation_failed'
                save(path, context)
                raise
            context['phase'] = 'validated'
            return save(path, context)

        def publish(path: Path) -> dict:
            context = load(path)
            if git(context, 'branch', '--show-current') != context['branch']:
                raise RuntimeError('Agent switched branches')
            metadata = load(path.parent / 'publication.json')
            files = git(context, 'ls-files', '--others', '--exclude-standard').splitlines()
            if any((Path(file).name.startswith('.env') or Path(file).suffix in ('.pem', '.key') for file in files)):
                raise RuntimeError('Refusing to stage a potential credential file')
            git(context, 'add', '--all')
            if git(context, 'diff', '--cached', '--name-only'):
                git(context, 'commit', '-m', metadata['subject'], '-m', metadata['body'])
            if not git(context, 'diff', f'origin/{context['base']}...HEAD', '--name-only'):
                raise RuntimeError('No implementation changes relative to base; refusing empty PR')
            git(context, 'push', '--set-upstream', 'origin', context['branch'])
            matches = gh('pr', 'list', '--repo', context['repository'], '--head', context['branch'], '--state', 'open', '--json', 'number,url')
            if len(matches) > 1:
                raise RuntimeError('Ambiguous PR list')
            body = path.parent / 'pr-body.md'
            body.write_text(metadata['pr_body'] + f'\n\nCloses #{context['issue']}\n')
            if not matches:
                execute(['gh', 'pr', 'create', '--repo', context['repository'], '--base', context['base'], '--head', context['branch'], '--title', metadata['pr_title'], '--body-file', str(body)])
                matches = gh('pr', 'list', '--repo', context['repository'], '--head', context['branch'], '--state', 'open', '--json', 'number,url')
            if len(matches) != 1:
                raise RuntimeError('Expected one published PR')
            if context.get('pr'):
                execute(['gh', 'pr', 'edit', str(matches[0]['number']), '--repo', context['repository'], '--title', metadata['pr_title'], '--body-file', str(body)])
            context.update(pr=matches[0]['number'], pr_url=matches[0]['url'], head=git(context, 'rev-parse', 'HEAD'), phase='published')
            return save(path, context)

        def review_context(path: Path, run: str) -> dict:
            context = load(path)
            directory = ROOT / 'reviews' / context['repository'] / f'issue-{context['issue']}-{run}'
            directory.parent.mkdir(parents=True, exist_ok=True)
            context.update(review_worktree=str(directory), review_branch=f'resolver/review-{run}', review_file=str(path.parent / 'review.json'))
            Path(context['review_file']).unlink(missing_ok=True)
            return save(path, context)

        def review_gate(path: Path) -> dict:
            context = load(path)
            raw = sys.stdin.read()
            (path.parent / 'review-agent.txt').write_text(raw)
            report = agent_object(raw, {'head_sha', 'verdict'})
            Path(context['review_file']).write_text(json.dumps(report, indent=2))
            run_checks(context, context['review_worktree'], path.parent, 'review-validation')
            assert_head(context, 'head')
            if git(context, 'status', '--porcelain', checkout=False):
                raise RuntimeError('Implementation worktree changed during review')
            review_status = execute(['git', 'status', '--porcelain'], context['review_worktree'])
            review_sha = execute(['git', 'rev-parse', 'HEAD'], context['review_worktree'])
            if review_status or review_sha != context['head']:
                raise RuntimeError('Reviewer modified the review worktree')
            if report.get('head_sha') != context['head'] or report.get('verdict') not in ('pass', 'block'):
                raise ValueError('Invalid review verdict or commit SHA')
            findings = report.get('findings')
            if not isinstance(findings, list) or not isinstance(report.get('summary'), str):
                raise ValueError('Invalid review schema')
            if not isinstance(report.get('report_markdown'), str) or not report['report_markdown'].strip():
                raise ValueError('Review requires the complete original review report')
            severities = {'critical', 'high', 'medium', 'low'}
            if any((not isinstance(finding, dict) or finding.get('severity') not in severities or (not isinstance(finding.get('message'), str)) for finding in findings)):
                raise ValueError('Invalid review findings')
            context['phase'] = 'reviewed'
            save(path, context)
            body = path.parent / 'review-comment.md'
            body.write_text(report['report_markdown'] + f'\n\n## Dagu independent review\n\nCommit: `{context['head']}`\n\nVerdict: **{report['verdict']}**\n\n{report['summary']}\n\n' + '\n'.join((f'- {item['severity']}: {item['message']}' for item in findings)))
            execute(['gh', 'pr', 'comment', str(context['pr']), '--repo', context['repository'], '--body-file', str(body)])
            if report['verdict'] != 'pass' or any((item['severity'] in ('critical', 'high') for item in findings)):
                context['phase'] = 'review_blocked'
                save(path, context)
                raise RuntimeError('Independent review blocked merge; see review.json')
            context['reviewed_sha'] = context['head']
            return save(path, context)

        def merge(path: Path) -> dict:
            context = ci_gate(path)
            if context['reviewed_sha'] != context['ci_sha']:
                raise RuntimeError('CI and review did not verify the same commit')
            assert_head(context, 'ci_sha')
            if not context['auto_merge']:
                context['phase'] = 'ready_for_merge'
                return save(path, context)
            execute(['gh', 'pr', 'merge', str(context['pr']), '--repo', context['repository'], '--squash', '--match-head-commit', context['ci_sha']], timeout=120)
            pr = pull_request(context)
            issue = gh('issue', 'view', str(context['issue']), '--repo', context['repository'], '--json', 'state')
            if pr['state'] != 'MERGED' or issue['state'] != 'CLOSED':
                raise RuntimeError('Remote merge or issue closure not confirmed; preserving worktree')
            context.update(merged=True, phase='merged')
            return save(path, context)

        def clean_review(path: Path) -> dict:
            if not path.exists():
                return {'phase': 'not_prepared'}
            context = load(path)
            tree = context.get('review_worktree')
            if tree and Path(tree).exists():
                git(context, 'worktree', 'remove', tree, checkout=True)
                git(context, 'branch', '-D', context['review_branch'], checkout=True)
            return context

        def finish(path: Path) -> dict:
            if not path.exists():
                return {'phase': 'not_prepared'}
            context = load(path)
            try:
                if not context['issue'] or context.get('phase') == 'no_work':
                    return context
                recovery(path)
                context = followups(path)
                phase = context['phase']
                status = 'merged and issue closed' if context.get('merged') else 'validated; PR ready, worktree preserved' if phase == 'ready_for_merge' else f'stopped at {phase}; worktree preserved'
                message = f'<b>Dagu issue resolution</b>\n{html.escape(context['repository'])} #{context['issue']}\n{status}\n'
                message += html.escape(context.get('pr_url', context.get('issue_url', '')))
                if context.get('models'):
                    message += '\nEconomy: ' + html.escape(context['models']['economy'])
                    message += '\nBalanced: ' + html.escape(context['models']['balanced'])
                if context.get('followups'):
                    message += f'\nFollow-ups: {len(context['followups'])}\n' + html.escape('\n'.join(context['followups'][:3]))
                token = os.environ.get('TELEGRAM_BOT_TOKEN')
                chat = os.environ.get('TELEGRAM_CHAT_ID')
                if not token or not chat:
                    raise RuntimeError('Telegram credentials missing')
                payload = urllib.parse.urlencode({'chat_id': chat, 'text': message, 'parse_mode': 'HTML', 'disable_web_page_preview': 'true'}).encode()
                request = urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data=payload, method='POST')
                try:
                    with urllib.request.urlopen(request, timeout=30) as response:
                        result = json.load(response)
                except (urllib.error.URLError, TimeoutError, ValueError):
                    raise RuntimeError('Telegram request failed; credentials and URL withheld') from None
                if not result.get('ok') or not result.get('result', {}).get('message_id'):
                    raise RuntimeError('Telegram did not confirm message delivery')
                print('Telegram API confirmed message delivery', file=sys.stderr)
                return context
            finally:
                release(context)

        def main() -> int:
            if len(sys.argv) > 1 and sys.argv[1] == 'agent':
                return run_agent()
            parser = argparse.ArgumentParser(description=__doc__)
            parser.add_argument('phase', choices=['prepare', 'select', 'resolve-models', 'snapshot', 'record-plan', 'diagnose', 'record-implementation', 'record-publication', 'validate', 'publish', 'review-context', 'review-gate', 'ci-gate', 'merge', 'clean-review', 'finish'])
            parser.add_argument('--state', required=True, type=Path)
            args = parser.parse_args()
            actions = {'prepare': prepare, 'select': select, 'resolve-models': resolve_models, 'snapshot': snapshot, 'record-plan': record_plan, 'diagnose': diagnose, 'record-implementation': record_implementation, 'record-publication': record_publication, 'validate': validate, 'publish': publish, 'review-context': lambda path: review_context(path, os.environ['RUN_ID']), 'review-gate': review_gate, 'ci-gate': ci_gate, 'merge': merge, 'clean-review': clean_review, 'finish': finish}
            try:
