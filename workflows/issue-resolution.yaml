        ## Validation and scope consistency

        Inspect every source listed in discovery.json: repository instructions, nested
        rules, Makefile targets, package scripts, project configuration and GitHub workflows.
        Identify type-check, lint/format, tests and build plus composite validation gates.
        Return one checks entry per category: kind, commands (array), reason. Include every
        catalog entry in its category using exact shlex-compatible argv, including nested
        project cwd wrappers. An absent category uses commands=[] with concrete evidence;
        cataloged checks cannot be omitted or N/A. Tests must have a real entrypoint.
        Inspect instructions and workflow run steps for additional applicable checks not
        covered by the catalog. Record any unsupported custom command, contradictory
        instructions, unavailable dependencies or ambiguous CI in blockers; do not guess,
        invent a check, or request replacement caller parameters. Confirm static matrix,
        reusable job names, branch/path/activity filters and effective branch CI policy.
