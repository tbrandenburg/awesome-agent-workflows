        patterns. Preserve the investigation artifact in run artifacts; Dagu retention
        replaces the old .claude/PRPs archive commit. Return an implementation report with
        changed files, acceptance criteria completed, exact validation evidence, documented
        deviations and remaining blockers. Never report commit/PR/review completion here.

        ## CI, review and conflict repair

        Read repair-context.json, validation logs and review.json if present. If repair
        tasks exist, follow the embedded ci-repair.md as well. Its scoped repair permission
        is the only exception to the no-merge rule and never permits merging a PR.
        Fix actual code errors, not tests merely to silence failures. Re-run applicable
        type-check, lint/format, tests, build and manual verification. No skipped gates.
