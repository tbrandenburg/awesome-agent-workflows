        ## Task Contract: prepare complete commit and PR metadata

        The original commit-push contract requires a non-main branch, reviewed/cohesive
        changes, a rich conventional commit, push, and a PR. Dagu executes those mutations;
        your responsibility is to inspect actual code/evidence and prepare their metadata.
        Do not stage, commit, push, switch branches, publish comments or create a PR.
        Inspect git status, git diff, git diff --staged, branch and validation artifacts.
        Check secrets, unintended files, and coherent issue scope before proposing metadata.

        ### 4. Categorize the Change

        | Type | When to Use | Example |
        |------|-------------|---------|
        | `feat` | New functionality | `feat(auth): add JWT refresh token rotation` |
        | `fix` | Bug fix | `fix(api): handle null response in user fetch` |
        | `refactor` | Code restructure | `refactor(db): extract query builder to module` |
        | `docs` | Documentation | `docs(api): add OpenAPI examples` |
        | `test` | Tests | `test(auth): add edge cases for token expiration` |
        | `chore` | Maintenance | `chore(deps): upgrade langfuse to v3.0` |
        | `perf` | Performance | `perf(search): add index for user lookups` |
        | `style` | Formatting | `style: apply ruff formatting` |

        ### 5. Craft Commit Message

        **Format:**
        ```
        type(scope): concise description (imperative mood)

        [Body - 2-4 sentences explaining WHY and CONTEXT]

        Changes:
        - Key change 1
        - Key change 2

        Pattern: [Patterns or conventions followed]
        Decision: [Key decisions made]
        Related: [Related files or components]
        ```

        **Rules:**
        1. **Subject line:**
           - Imperative mood: "add" not "added"
           - Include scope: `feat(auth)`, `fix(api/users)`
           - Under 72 characters
           - Specific and descriptive

        2. **Body:**
           - Explain WHY, not just what
           - Mention patterns established
           - Note non-obvious decisions
           - Reference related components

        3. **Context for future agents:**
           - Database locations
           - File patterns followed
           - Architecture decisions
           - Gotchas or edge cases
        **PR Description Template:**

        ```markdown
        ## Problem
        [What issue does this solve? What was broken or missing?]

        ## Solution
        [High-level approach and key decisions]

        ## Changes
        - File/component changes
        - New patterns introduced
        - Related updates

        ## Testing
        [Validation performed]

        ## Example Output
        [Code examples, screenshots, or output samples]

        ## Notes
        [Additional context, breaking changes, follow-up items]
        ```
        Include the original issue-fix context in the PR: problem/root cause or rationale,
        changes, test evidence, exact commands, examples when applicable, plan adherence,
        documented deviations, scope, risks and follow-ups. Read implementation-report.md
        and the complete plan; do not invent passing checks. Mark genuinely absent checks
        as not applicable with the planner's reason. Dagu appends Closes #<pinned issue>.
        Return subject (conventional type(scope), under 72 characters), body explaining
        WHY, pr_title, and complete pr_body. Refuse metadata for unrelated/unsafe changes.
