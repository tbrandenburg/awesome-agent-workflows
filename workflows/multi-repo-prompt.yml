description: Run a prompt in a fresh worktree of each listed repo
type: graph

params:
  - { name: repos, type: string, required: true }  # one owner/name per line
  - { name: prompt, type: string, required: true }
  - { name: branch, type: string, default: chore/agent-task }

steps:
  # Dagu does not escape quotes when handing params to a child DAG.
  - id: escaped_prompt
    action: exec
    with:
      command: sh
      args:
        - -c
        - 'printf %s "$1" | sed "s/[\\\\\"]/\\\\&/g"'
        - sh
        - ${params.prompt}
    output: ESCAPED_PROMPT

  - id: per_repo
    depends: [escaped_prompt]
    action: dag.run
    parallel:
      items: ${params.repos}
      max_concurrent: 2
    with:
      dag: repo-prompt.yml
      params:
        repo: ${ITEM}
        prompt: ${env.ESCAPED_PROMPT}
        branch: ${params.branch}
